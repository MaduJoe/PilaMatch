services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-pilamatch}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pilamatch}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pilamatch}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - DEBUG=${DEBUG:-false}
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - TOSS_CLIENT_KEY=${TOSS_CLIENT_KEY:-}
      - TOSS_SECRET_KEY=${TOSS_SECRET_KEY:-}
      - TOSS_WEBHOOK_SECRET=${TOSS_WEBHOOK_SECRET:-}
      - SMS_PROVIDER=${SMS_PROVIDER:-mock}
      - SMS_API_KEY=${SMS_API_KEY:-}
      - SMS_API_SECRET=${SMS_API_SECRET:-}
      - SMS_SENDER_NUMBER=${SMS_SENDER_NUMBER:-}
      - NTS_SERVICE_KEY=${NTS_SERVICE_KEY:-}
      - CRON_SECRET=${CRON_SECRET:-}
      - BANK_ACCOUNT_NUMBER=${BANK_ACCOUNT_NUMBER:-}
      - BANK_ACCOUNT_HOLDER=${BANK_ACCOUNT_HOLDER:-}
      - BANK_NAME=${BANK_NAME:-}
      - APP_ENV=${APP_ENV:-development}
      - KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY:-}
    volumes:
      - ./backend:/app  # hot reload
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/v1}
        - NEXT_PUBLIC_TOSS_CLIENT_KEY=${TOSS_CLIENT_KEY:-}
        - NEXT_PUBLIC_KAKAO_MAP_KEY=${KAKAO_MAP_KEY:-}
        - BACKEND_URL=http://backend:8000
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

volumes:
  postgres_data:
  redis_data:
