# 프로덕션 환경 설정
# 사용: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  backend:
    environment:
      - APP_ENV=production
      - WORKERS=4
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    restart: always
